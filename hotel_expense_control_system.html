
<h2 class="sr-only">Sistema de controle de gastos do hotel — sem dados, pronto para uso</h2>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .container { padding: 1.5rem 0; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
  .hotel-icon { width: 40px; height: 40px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); display: flex; align-items: center; justify-content: center; }
  .page-title { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  .page-sub { font-size: 13px; color: var(--color-text-secondary); margin-top: 2px; }
  .tab-bar { display: flex; gap: 4px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 3px; margin-bottom: 1.5rem; width: fit-content; }
  .tab { padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer; color: var(--color-text-secondary); border: none; background: transparent; font-family: var(--font-sans); transition: all 0.15s; }
  .tab.active { background: var(--color-background-primary); color: var(--color-text-primary); border: 0.5px solid var(--color-border-tertiary); font-weight: 500; }
  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .metric-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem; }
  .metric-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 6px; }
  .metric-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .metric-sub { font-size: 11px; margin-top: 4px; color: var(--color-text-secondary); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 1.5rem; }
  .card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; }
  .card-title { font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
  .expense-form { display: flex; flex-direction: column; gap: 10px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .form-group { display: flex; flex-direction: column; gap: 4px; }
  .form-label { font-size: 12px; color: var(--color-text-secondary); }
  .form-input { padding: 7px 10px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); background: var(--color-background-secondary); color: var(--color-text-primary); font-size: 13px; font-family: var(--font-sans); width: 100%; }
  .form-input:focus { outline: none; border-color: var(--color-border-primary); }
  .btn-add { width: 100%; padding: 8px; background: var(--color-text-primary); color: var(--color-background-primary); border: none; border-radius: var(--border-radius-md); font-size: 13px; font-weight: 500; cursor: pointer; font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-add:hover { opacity: 0.85; }
  .expense-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
  .expense-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-size: 13px; }
  .expense-left { display: flex; align-items: center; gap: 8px; }
  .cat-badge { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .cat-manutencao { background: #E6F1FB; color: #185FA5; }
  .cat-alimentacao { background: #EAF3DE; color: #3B6D11; }
  .cat-limpeza { background: #FAEEDA; color: #854F0B; }
  .cat-adm { background: #EEEDFE; color: #534AB7; }
  .cat-marketing { background: #FBEAF0; color: #993556; }
  .cat-rh { background: #E1F5EE; color: #0F6E56; }
  .cat-outros { background: #F1EFE8; color: #5F5E5A; }
  .expense-desc { color: var(--color-text-primary); }
  .expense-date { font-size: 11px; color: var(--color-text-secondary); }
  .expense-right { display: flex; align-items: center; gap: 10px; }
  .expense-value { font-weight: 500; color: var(--color-text-primary); }
  .btn-del { background: none; border: none; cursor: pointer; color: var(--color-text-secondary); padding: 2px 4px; border-radius: 4px; font-size: 14px; line-height: 1; }
  .btn-del:hover { color: #A32D2D; background: #FCEBEB; }
  .chart-section { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
  .chart-legend { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; font-size: 12px; color: var(--color-text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
  .filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 1rem; }
  .filter-select { padding: 6px 10px; border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); font-size: 12px; background: var(--color-background-secondary); color: var(--color-text-primary); font-family: var(--font-sans); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); border-bottom: 0.5px solid var(--color-border-tertiary); text-transform: uppercase; letter-spacing: 0.04em; }
  tbody td { padding: 9px 12px; border-bottom: 0.5px solid var(--color-border-tertiary); color: var(--color-text-primary); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: var(--color-background-secondary); }
  .progress-bar-wrap { width: 100%; background: var(--color-background-secondary); border-radius: 4px; height: 6px; overflow: hidden; }
  .progress-bar-fill { height: 6px; border-radius: 4px; }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 1rem; color: var(--color-text-secondary); gap: 8px; }
  .empty-state i { font-size: 28px; opacity: 0.4; }
  .empty-state p { font-size: 13px; }
  .section-hidden { display: none; }
</style>

<div class="container">
  <div class="header">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="hotel-icon"><i class="ti ti-building" style="font-size:20px; color: var(--color-text-secondary);" aria-hidden="true"></i></div>
      <div>
        <div class="page-title">Controle de Gastos</div>
        <div class="page-sub">Grand Hotel — Gestão Financeira</div>
      </div>
    </div>
    <div style="font-size: 12px; color: var(--color-text-secondary); display:flex; align-items:center; gap:6px;">
      <i class="ti ti-calendar" style="font-size:14px;" aria-hidden="true"></i>
      Maio 2026
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="showTab('dashboard')">Dashboard</button>
    <button class="tab" onclick="showTab('lancamentos')">Lançamentos</button>
    <button class="tab" onclick="showTab('relatorio')">Relatório</button>
  </div>

  <div id="tab-dashboard">
    <div class="metrics" id="metrics-cards"></div>
    <div class="two-col">
      <div class="card">
        <div class="card-title"><i class="ti ti-plus" aria-hidden="true" style="font-size:15px;"></i> Novo gasto</div>
        <div class="expense-form">
          <div class="form-group">
            <label class="form-label">Descrição</label>
            <input class="form-input" id="inp-desc" type="text" placeholder="Ex: Troca de encanamento">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Valor (R$)</label>
              <input class="form-input" id="inp-val" type="number" placeholder="0,00" min="0" step="0.01">
            </div>
            <div class="form-group">
              <label class="form-label">Categoria</label>
              <select class="form-input" id="inp-cat">
                <option value="manutencao">Manutenção</option>
                <option value="alimentacao">Alimentação</option>
                <option value="limpeza">Limpeza</option>
                <option value="adm">Administrativo</option>
                <option value="marketing">Marketing</option>
                <option value="rh">RH</option>
                <option value="outros">Outros</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Data</label>
              <input class="form-input" id="inp-date" type="date">
            </div>
            <div class="form-group">
              <label class="form-label">Responsável</label>
              <input class="form-input" id="inp-resp" type="text" placeholder="Nome">
            </div>
          </div>
          <button class="btn-add" onclick="addExpense()"><i class="ti ti-plus" aria-hidden="true"></i> Registrar gasto</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-clock" aria-hidden="true" style="font-size:15px;"></i> Gastos recentes</div>
        <div class="expense-list" id="expense-list-recent"></div>
      </div>
    </div>

    <div class="chart-section">
      <div class="card-title" style="margin-bottom:12px;"><i class="ti ti-chart-bar" aria-hidden="true" style="font-size:15px;"></i> Gastos por categoria (mês atual)</div>
      <div class="chart-legend" id="chart-legend"></div>
      <div style="position: relative; width: 100%; height: 260px;" id="bar-wrap">
        <canvas id="catChart" role="img" aria-label="Gráfico de gastos por categoria do hotel"></canvas>
      </div>
    </div>
  </div>

  <div id="tab-lancamentos" class="section-hidden">
    <div class="card" style="margin-bottom:1.5rem;">
      <div class="filter-bar">
        <i class="ti ti-filter" style="font-size:15px; color: var(--color-text-secondary);" aria-hidden="true"></i>
        <select class="filter-select" id="filter-cat" onchange="renderTable()">
          <option value="">Todas categorias</option>
          <option value="manutencao">Manutenção</option>
          <option value="alimentacao">Alimentação</option>
          <option value="limpeza">Limpeza</option>
          <option value="adm">Administrativo</option>
          <option value="marketing">Marketing</option>
          <option value="rh">RH</option>
          <option value="outros">Outros</option>
        </select>
        <select class="filter-select" id="filter-month" onchange="renderTable()">
          <option value="">Todos meses</option>
          <option value="2026-05" selected>Maio 2026</option>
          <option value="2026-04">Abril 2026</option>
          <option value="2026-03">Março 2026</option>
        </select>
        <span id="table-count" style="font-size:12px; color: var(--color-text-secondary); margin-left:auto;"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th>Data</th><th>Descrição</th><th>Categoria</th><th>Responsável</th><th style="text-align:right;">Valor</th><th></th>
          </tr></thead>
          <tbody id="expense-table"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="tab-relatorio" class="section-hidden">
    <div class="two-col" style="margin-bottom:1.5rem;">
      <div class="card">
        <div class="card-title"><i class="ti ti-chart-donut" aria-hidden="true" style="font-size:15px;"></i> Distribuição por categoria</div>
        <div style="position: relative; width: 100%; height: 220px;" id="pie-wrap">
          <canvas id="pieChart" role="img" aria-label="Distribuição percentual de gastos por categoria"></canvas>
        </div>
      </div>
      <div class="card">
        <div class="card-title"><i class="ti ti-list" aria-hidden="true" style="font-size:15px;"></i> Ranking de categorias</div>
        <div id="ranking-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
      </div>
    </div>
    <div class="chart-section">
      <div class="card-title" style="margin-bottom:12px;"><i class="ti ti-trending-up" aria-hidden="true" style="font-size:15px;"></i> Evolução mensal</div>
      <div style="position: relative; width: 100%; height: 240px;" id="line-wrap">
        <canvas id="lineChart" role="img" aria-label="Evolução mensal dos gastos totais"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const catLabels = { manutencao:'Manutenção', alimentacao:'Alimentação', limpeza:'Limpeza', adm:'Administrativo', marketing:'Marketing', rh:'RH', outros:'Outros' };
const catColors = { manutencao:'#378ADD', alimentacao:'#639922', limpeza:'#BA7517', adm:'#7F77DD', marketing:'#D4537E', rh:'#1D9E75', outros:'#888780' };
let expenses = [];
let nextId = 1;
let barChart, pieChart, lineChart;

document.getElementById('inp-date').valueAsDate = new Date();

function fmt(val) { return 'R$ ' + val.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }); }

function addExpense() {
  const desc = document.getElementById('inp-desc').value.trim();
  const val = parseFloat(document.getElementById('inp-val').value);
  const cat = document.getElementById('inp-cat').value;
  const date = document.getElementById('inp-date').value;
  const resp = document.getElementById('inp-resp').value.trim() || 'Não informado';
  const dEl = document.getElementById('inp-desc'), vEl = document.getElementById('inp-val');
  dEl.style.borderColor = !desc ? '#E24B4A' : '';
  vEl.style.borderColor = (isNaN(val)||val<=0) ? '#E24B4A' : '';
  if (!desc || isNaN(val) || val <= 0 || !date) return;
  dEl.style.borderColor = ''; vEl.style.borderColor = '';
  expenses.unshift({ id: nextId++, desc, val, cat, date, resp });
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-val').value = '';
  renderAll();
}

function deleteExpense(id) { expenses = expenses.filter(e => e.id !== id); renderAll(); }

function catTotals(filterMonth) {
  const totals = {};
  expenses.forEach(e => { if (filterMonth && !e.date.startsWith(filterMonth)) return; totals[e.cat] = (totals[e.cat]||0) + e.val; });
  return totals;
}

function renderMetrics() {
  const now = '2026-05';
  const prev = '2026-04';
  const thisM = expenses.filter(e => e.date.startsWith(now));
  const lastM = expenses.filter(e => e.date.startsWith(prev));
  const totalThis = thisM.reduce((s,e) => s+e.val, 0);
  const totalLast = lastM.reduce((s,e) => s+e.val, 0);
  const diff = totalLast ? Math.round((totalThis - totalLast) / totalLast * 100) : null;
  const topCat = Object.entries(catTotals(now)).sort((a,b) => b[1]-a[1])[0];
  const qtd = thisM.length;
  const avg = qtd ? Math.round(totalThis / qtd) : 0;
  document.getElementById('metrics-cards').innerHTML = `
    <div class="metric-card">
      <div class="metric-label"><i class="ti ti-wallet" aria-hidden="true" style="font-size:13px; margin-right:4px;"></i>Total maio</div>
      <div class="metric-value">${fmt(totalThis)}</div>
      <div class="metric-sub">${diff !== null ? (diff > 0 ? '+' : '') + diff + '% vs abril' : 'sem dados anteriores'}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label"><i class="ti ti-calendar" aria-hidden="true" style="font-size:13px; margin-right:4px;"></i>Lançamentos</div>
      <div class="metric-value">${qtd}</div>
      <div class="metric-sub">este mês</div>
    </div>
    <div class="metric-card">
      <div class="metric-label"><i class="ti ti-chart-bar" aria-hidden="true" style="font-size:13px; margin-right:4px;"></i>Maior categoria</div>
      <div class="metric-value" style="font-size:16px;">${topCat ? catLabels[topCat[0]] : '—'}</div>
      <div class="metric-sub">${topCat ? fmt(topCat[1]) : 'sem lançamentos'}</div>
    </div>
    <div class="metric-card">
      <div class="metric-label"><i class="ti ti-calculator" aria-hidden="true" style="font-size:13px; margin-right:4px;"></i>Ticket médio</div>
      <div class="metric-value">${fmt(avg)}</div>
      <div class="metric-sub">por lançamento</div>
    </div>
  `;
}

function renderRecent() {
  const el = document.getElementById('expense-list-recent');
  if (!expenses.length) { el.innerHTML = '<div class="empty-state"><i class="ti ti-inbox" aria-hidden="true"></i><p>Nenhum gasto registrado ainda</p></div>'; return; }
  el.innerHTML = expenses.slice(0,6).map(e => `
    <div class="expense-item">
      <div class="expense-left">
        <span class="cat-badge cat-${e.cat}">${catLabels[e.cat]}</span>
        <div><div class="expense-desc">${e.desc}</div><div class="expense-date">${e.date} · ${e.resp}</div></div>
      </div>
      <div class="expense-right">
        <div class="expense-value">${fmt(e.val)}</div>
        <button class="btn-del" onclick="deleteExpense(${e.id})" aria-label="Remover gasto"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>
    </div>`).join('');
}

function renderBarChart() {
  const totals = catTotals('2026-05');
  const keys = Object.keys(catLabels).filter(k => totals[k]);
  document.getElementById('chart-legend').innerHTML = keys.map(k => `<span style="display:flex;align-items:center;gap:4px;"><span class="legend-dot" style="background:${catColors[k]};"></span>${catLabels[k]}</span>`).join('');
  const wrap = document.getElementById('bar-wrap');
  if (!keys.length) { wrap.innerHTML = '<div class="empty-state"><i class="ti ti-chart-bar" aria-hidden="true"></i><p>Registre gastos para ver o gráfico</p></div>'; if(barChart){barChart.destroy();barChart=null;} return; }
  if (!wrap.querySelector('canvas')) { wrap.innerHTML = '<canvas id="catChart" role="img" aria-label="Gráfico de gastos por categoria do hotel"></canvas>'; }
  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('catChart'), {
    type: 'bar',
    data: { labels: keys.map(k => catLabels[k]), datasets: [{ data: keys.map(k => Math.round(totals[k])), backgroundColor: keys.map(k => catColors[k]), borderRadius: 4, borderSkipped: false }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + fmt(ctx.raw) } } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 11 } } }, y: { grid: { color: 'rgba(128,128,128,0.1)' }, ticks: { callback: v => 'R$ '+(v/1000).toFixed(0)+'k', font: { size: 11 } } } } }
  });
}

function renderTable() {
  const fc = document.getElementById('filter-cat').value;
  const fm = document.getElementById('filter-month').value;
  const filtered = expenses.filter(e => (!fc || e.cat===fc) && (!fm || e.date.startsWith(fm)));
  document.getElementById('table-count').textContent = filtered.length + ' registros';
  document.getElementById('expense-table').innerHTML = filtered.length ? filtered.map(e => `
    <tr>
      <td>${e.date}</td><td>${e.desc}</td>
      <td><span class="cat-badge cat-${e.cat}">${catLabels[e.cat]}</span></td>
      <td style="color:var(--color-text-secondary);">${e.resp}</td>
      <td style="text-align:right;font-weight:500;">${fmt(e.val)}</td>
      <td><button class="btn-del" onclick="deleteExpense(${e.id})" aria-label="Remover"><i class="ti ti-trash" aria-hidden="true"></i></button></td>
    </tr>`).join('')
    : '<tr><td colspan="6" style="text-align:center;color:var(--color-text-secondary);padding:2rem;">Nenhum registro encontrado</td></tr>';
}

function renderPieChart() {
  const totals = catTotals('2026-05');
  const keys = Object.keys(catLabels).filter(k => totals[k]);
  const wrap = document.getElementById('pie-wrap');
  if (!keys.length) { wrap.innerHTML = '<div class="empty-state"><i class="ti ti-chart-donut" aria-hidden="true"></i><p>Sem dados para exibir</p></div>'; if(pieChart){pieChart.destroy();pieChart=null;} return; }
  if (!wrap.querySelector('canvas')) { wrap.innerHTML = '<canvas id="pieChart" role="img" aria-label="Distribuição percentual de gastos por categoria"></canvas>'; }
  if (pieChart) pieChart.destroy();
  pieChart = new Chart(document.getElementById('pieChart'), {
    type: 'doughnut',
    data: { labels: keys.map(k => catLabels[k]), datasets: [{ data: keys.map(k => Math.round(totals[k])), backgroundColor: keys.map(k => catColors[k]), borderWidth: 2, borderColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + fmt(ctx.raw) } } }, cutout: '60%' }
  });
}

function renderRanking() {
  const totals = catTotals('2026-05');
  const total = Object.values(totals).reduce((a,b) => a+b, 0);
  const sorted = Object.entries(totals).sort((a,b) => b[1]-a[1]);
  const el = document.getElementById('ranking-list');
  if (!sorted.length) { el.innerHTML = '<div class="empty-state"><i class="ti ti-list" aria-hidden="true"></i><p>Sem dados para exibir</p></div>'; return; }
  el.innerHTML = sorted.map(([k,v]) => { const pct = total ? Math.round(v/total*100) : 0; return `
    <div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
        <span style="color:var(--color-text-primary);">${catLabels[k]}</span><span style="font-weight:500;">${pct}%</span>
      </div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${pct}%;background:${catColors[k]};"></div></div>
      <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px;">${fmt(v)}</div>
    </div>`; }).join('');
}

function renderLineChart() {
  const months = ['2026-03','2026-04','2026-05'];
  const labels = ['Mar 2026','Abr 2026','Mai 2026'];
  const totals = months.map(m => Math.round(expenses.filter(e => e.date.startsWith(m)).reduce((s,e) => s+e.val, 0)));
  const wrap = document.getElementById('line-wrap');
  if (totals.every(v => v === 0)) { wrap.innerHTML = '<div class="empty-state"><i class="ti ti-trending-up" aria-hidden="true"></i><p>Sem dados para exibir</p></div>'; if(lineChart){lineChart.destroy();lineChart=null;} return; }
  if (!wrap.querySelector('canvas')) { wrap.innerHTML = '<canvas id="lineChart" role="img" aria-label="Evolução mensal dos gastos totais"></canvas>'; }
  if (lineChart) lineChart.destroy();
  lineChart = new Chart(document.getElementById('lineChart'), {
    type: 'line',
    data: { labels, datasets: [{ label: 'Total gastos', data: totals, borderColor: '#378ADD', backgroundColor: 'rgba(55,138,221,0.08)', borderWidth: 2, pointBackgroundColor: '#378ADD', pointRadius: 5, tension: 0.3, fill: true }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: ctx => ' ' + fmt(ctx.raw) } } }, scales: { x: { grid: { display: false }, ticks: { font: { size: 12 } } }, y: { grid: { color: 'rgba(128,128,128,0.1)' }, ticks: { callback: v => 'R$ '+(v/1000).toFixed(0)+'k', font: { size: 11 } } } } }
  });
}

function renderAll() { renderMetrics(); renderRecent(); renderBarChart(); renderTable(); renderPieChart(); renderRanking(); renderLineChart(); }

function showTab(tab) {
  ['dashboard','lancamentos','relatorio'].forEach(t => document.getElementById('tab-'+t).classList.toggle('section-hidden', t!==tab));
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', ['dashboard','lancamentos','relatorio'][i]===tab));
  if (tab==='relatorio') { renderPieChart(); renderRanking(); renderLineChart(); }
}

renderAll();
</script>
